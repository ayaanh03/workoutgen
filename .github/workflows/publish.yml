# Publishes to PyPI when a GitHub release is published. One-time setup on
# pypi.org: add a trusted publisher for project "workoutgen" with owner
# ayaanh03, repository workoutgen, workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python test_workoutgen.py
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
