# Publishes to PyPI when a GitHub release is published, or when run by hand
# (Actions -> publish -> Run workflow). One-time setup on pypi.org: a trusted
# publisher for project "workoutgen" with owner ayaanh03, repository
# workoutgen, workflow publish.yml, environment pypi.
# Release: bump `version` in pyproject.toml, merge, then publish a release
# tagged v<version> (or run this workflow on main).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: pypi-publish

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/workoutgen
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the release tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python test_workoutgen.py
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI is skipped, so publishing a release
          # for a version that was run by hand doesn't fail.
          skip-existing: true
