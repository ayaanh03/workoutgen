# Publishes to PyPI when a version tag is pushed. One-time setup on pypi.org:
# a trusted publisher for project "workoutgen" with owner ayaanh03,
# repository workoutgen, workflow publish.yml, environment pypi.
# Release: bump `version` in pyproject.toml, merge, then
#   git tag v<version> && git push origin v<version>
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/workoutgen
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python test_workoutgen.py
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
